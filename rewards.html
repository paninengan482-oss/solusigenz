<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><style>.simple-page{max-width:900px;margin:0 auto;padding:28px 18px 90px}.simple-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.simple-card{background:#fff;border:1px solid #e8eaf0;border-radius:20px;padding:22px;box-shadow:0 12px 30px rgba(16,24,40,.05);margin-bottom:14px}.simple-card h1,.simple-card h2{margin-top:0}.simple-card p{color:#667085;line-height:1.7}.simple-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.simple-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.simple-field label{font-size:12px;font-weight:700}.simple-field input,.simple-field textarea{padding:11px 12px;border:1px solid #dfe3ea;border-radius:10px}.simple-btn{border:0;background:#6d3df5;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}.simple-link{color:#6d3df5;font-weight:700}@media(max-width:700px){.simple-grid{grid-template-columns:1fr}.simple-page{padding-top:16px}.simple-card{padding:16px;border-radius:15px}}</style><title>Poin Reward</title></head><body class="v13-body"><main class="simple-page"><div class="simple-top"><a class="simple-link" href="shop.html">← Dashboard</a><b>REWARD</b></div><section class="simple-card"><h1>Poin Reward Solusi Genz 🎁</h1><p id="rewardDesc">Setiap pembelian mendapatkan poin reward.</p><div class="simple-grid"><div class="simple-card"><h2><span id="rewardRate">1</span> Poin</h2><p>didapat dari setiap 1 pembelian yang memenuhi syarat.</p></div><div class="simple-card"><h2>Hadiah</h2><p>Jenis hadiah dan jumlah poin penukaran akan ditentukan owner Solusi Genz.</p></div></div></section></main><script src="supabase-config.js"></script><script src="assets/store-settings.js"></script><script>document.addEventListener('sg-settings-ready',e=>{rewardRate.textContent=e.detail.reward_per_purchase;rewardDesc.textContent=e.detail.reward_note});sgLoadSettings()</script></body></html>
