<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Solusi Genz</title><link rel="stylesheet" href="launch.css"></head><body><main class="auth-page"><section class="card auth-card"><a class="auth-logo" href="index.html"><span class="sg-dot">SG</span><span class="brand-copy"><strong>SOLUSI GENZ</strong><small>Admin Access</small></span></a><span class="kicker">AKSES ADMIN</span><h1>Masuk ke Dashboard Admin</h1><p class="muted">Halaman ini khusus pengelola. Akses dashboard tetap divalidasi berdasarkan akun Admin.</p><div class="field"><label>Email Admin</label><input id="email" type="email"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password"></div><button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:18px">Masuk</button><div id="msg" class="notice" style="display:none;margin-top:12px"></div></section></main><script src="supabase-config.js"></script><script>
async function req(path,body,token=''){const h={'Content-Type':'application/json','apikey':SG_SUPABASE_KEY};if(token)h.Authorization='Bearer '+token;return fetch(SG_SUPABASE_URL+path,{method:'POST',headers:h,body:JSON.stringify(body)})}loginBtn.onclick=async()=>{if(!email.value.trim()||!password.value)return;loginBtn.disabled=true;try{const r=await req('/auth/v1/token?grant_type=password',{email:email.value.trim(),password:password.value});const t=await r.text();if(!r.ok)throw Error(t);const d=JSON.parse(t),tok=d.access_token;const cr=await req('/rest/v1/rpc/sg_is_admin',{},tok);if(!cr.ok)throw Error(await cr.text());const ok=JSON.parse(await cr.text()||'false');if(!ok)throw Error('not admin');sessionStorage.setItem('sg_admin_token',tok);sessionStorage.setItem('sg_admin_email',email.value.trim());location.replace('admin.html')}catch(e){msg.style.display='block';msg.className='notice warn';msg.textContent='Login Admin gagal atau akun ini bukan Admin.'}finally{loginBtn.disabled=false}};
</script></body></html>
