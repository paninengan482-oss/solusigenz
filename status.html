<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Pesanan — Solusi Genz</title><link rel="stylesheet" href="launch.css"></head><body><script>if(!localStorage.getItem('sg_user_token'))location.replace('auth.html')</script><nav class="public-nav"><div class="container nav-inner"><a class="brand-mini" href="shop.html"><span class="sg-dot">SG</span><span class="brand-copy"><strong>SOLUSI GENZ</strong><small>Pesanan Saya</small></span></a><a class="btn btn-outline" href="shop.html#orders">Kembali</a></div></nav><main class="section"><div class="container"><div class="two-col"><section class="card panel"><span class="kicker">DETAIL PESANAN</span><h2 id="invoiceTitle">Pesanan</h2><div id="orderInfo" class="notice">Memuat...</div><div id="paymentArea" style="margin-top:16px"></div><div id="accessArea" style="margin-top:16px"></div></section><aside class="card panel"><h3>Butuh Bantuan?</h3><p class="muted">Jika akses produk bermasalah, kirimkan kendala dari sini. Admin akan melihat invoice dan akunmu.</p><div class="field"><label>Jelaskan kendala</label><textarea id="supportMessage" rows="5" placeholder="Contoh: password tidak bisa digunakan..."></textarea></div><button id="supportBtn" class="btn btn-outline" style="width:100%;margin-top:10px">Kirim Permintaan Bantuan</button><div id="supportMsg" class="notice" style="display:none;margin-top:10px"></div></aside></div></div></main><script src="supabase-config.js"></script><script>
const token=localStorage.getItem('sg_user_token'),invoice=(new URLSearchParams(location.search).get('id')||'').trim().toUpperCase(),money=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));invoiceTitle.textContent=invoice||'Pesanan';async function rpc(n,b={}){const r=await fetch(SG_SUPABASE_URL+'/rest/v1/rpc/'+n,{method:'POST',headers:{'Content-Type':'application/json','apikey':SG_SUPABASE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify(b),cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function resize(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1100,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=fr.result};fr.readAsDataURL(file)})}async function load(){try{const orders=await rpc('sg_user_orders'),o=orders.find(x=>x.invoice===invoice);if(!o){orderInfo.textContent='Pesanan tidak ditemukan pada akun ini.';return}orderInfo.innerHTML=`<span class="pill ${o.status==='Selesai'?'ok':o.status==='Menunggu Verifikasi'?'warn':''}">${esc(o.status)}</span><h3>${esc(o.product_name)}</h3><p><b>${money(o.price)}</b><br>${esc(o.payment_method||'-')}<br>${new Date(o.created_at).toLocaleString('id-ID')}</p>`;let proof=[];try{proof=await rpc('sg_my_payment_proof',{p_invoice:invoice})}catch(_){}const p=proof?.[0];if(['Menunggu Pembayaran','Dibatalkan'].includes(o.status)||p?.status==='Ditolak')paymentArea.innerHTML=`<div class="notice ${p?.status==='Ditolak'?'warn':''}"><b>${p?.status==='Ditolak'?'Bukti perlu dikirim ulang':'Kirim Bukti Pembayaran'}</b>${p?.reject_reason?`<p>Alasan: ${esc(p.reject_reason)}</p>`:''}<p>Setelah transfer melalui metode yang dipilih saat checkout, unggah foto/screenshot bukti pembayaran. Upload bukti tidak otomatis berarti pembayaran sah; Admin tetap melakukan verifikasi dana.</p><div class="field"><label>Foto bukti pembayaran</label><input id="proofFile" type="file" accept="image/*"></div><div class="field" style="margin-top:10px"><label>Catatan (opsional)</label><input id="proofNote" placeholder="Contoh: transfer dari rekening a.n. ..."></div><button id="proofBtn" class="btn btn-primary" style="width:100%;margin-top:12px">Kirim Bukti</button><div id="proofMsg" style="margin-top:8px"></div></div>`;else if(o.status==='Menunggu Verifikasi')paymentArea.innerHTML='<div class="notice warn"><b>Bukti pembayaran sudah dikirim.</b><br>Status saat ini Menunggu Verifikasi Pembayaran oleh Admin.</div>';else paymentArea.innerHTML='<div class="notice ok"><b>Pembayaran sudah diverifikasi.</b><br>Pesanan sedang diproses.</div>';const pb=document.getElementById('proofBtn');if(pb)pb.onclick=async()=>{const f=proofFile.files[0];if(!f)return alert('Pilih foto bukti pembayaran.');pb.disabled=true;proofMsg.textContent='Mengunggah...';try{const data=await resize(f);await rpc('sg_submit_payment_proof',{p_invoice:invoice,p_proof_data_url:data,p_note:proofNote.value.trim()});proofMsg.innerHTML='<b>Bukti berhasil dikirim.</b>';setTimeout(load,600)}catch(e){proofMsg.textContent='Bukti belum berhasil dikirim.';pb.disabled=false}};try{const acc=await rpc('sg_my_product_access',{p_invoice:invoice}),a=acc?.[0];if(a)accessArea.innerHTML=`<div class="access-box"><span class="kicker">AKSES PRODUK</span><h3>Akses sudah tersedia</h3><p><b>Email/Username:</b> ${esc(a.login_identity||'-')}<br><b>Password:</b> <span id="secret">••••••••</span> <button class="btn btn-outline" style="padding:5px 8px" onclick="secret.textContent=${JSON.stringify(a.login_secret||'-')}">Lihat</button><br><b>Masa aktif:</b> ${esc(a.active_until||'-')}</p><p>${esc(a.login_instruction||'')}</p></div>`}catch(_){}}catch(e){orderInfo.textContent='Detail pesanan belum dapat dimuat. Pastikan migration launch sudah dijalankan.'}}supportBtn.onclick=async()=>{if(!invoice||!supportMessage.value.trim())return alert('Tulis kendalanya dulu.');supportBtn.disabled=true;try{await rpc('sg_submit_support_ticket',{p_invoice:invoice,p_message:supportMessage.value.trim()});supportMsg.style.display='block';supportMsg.className='notice ok';supportMsg.textContent='Permintaan bantuan sudah dikirim ke Admin.';supportMessage.value=''}catch(e){supportMsg.style.display='block';supportMsg.textContent='Permintaan belum berhasil dikirim.'}finally{supportBtn.disabled=false}};load();
</script></body></html>
