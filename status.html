<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>Status Pesanan — Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="solusi-genz-theme.css"><style>
.sg-order-state{text-align:center;padding:26px 18px}.sg-order-state .state-icon{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;background:#315df6;color:#fff}.sg-order-state h2{margin:14px 0 8px}.sg-order-state p{margin:7px 0}.sg-order-state .muted{opacity:.72}
@media(max-width:640px){.form-card h1{font-size:34px}.form-card .field>div{display:grid!important}.form-card #checkBtn{width:100%}}
</style></head><body>
<script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script>
<nav class="nav"><div class="container navin"><a class="brand" href="index.html"><span data-sg-logo><img src="solusi-genz-v2.svg"></span></a><a class="btn btn-ghost" href="shop.html">Kembali</a></div></nav>
<div class="container form-wrap"><div class="card form-card"><div class="badge" style="margin-bottom:12px">PESANAN & AKSES</div><h1>Status Pesanan</h1><div class="field"><label>Nomor invoice</label><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="invoice" placeholder="Contoh: SGZ-A1B2C3D4E5F6"><button id="checkBtn" class="btn btn-primary" type="button">Cek Pesanan</button></div></div><div id="result"></div></div></div>
<script src="supabase-config.js"></script><script src="store-settings-v14.js"></script>
<script>
(function(){
 const BANK_NAME="Bank Mandiri",ACCOUNT_NAME="DEDE",ACCOUNT_NO="1330035817931";
 const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search),idq=qs.get("id")||localStorage.getItem("sg_last_invoice")||"",isNew=qs.get("new")==="1",token=localStorage.getItem("sg_user_token")||"",myEmail=(localStorage.getItem("sg_user_email")||"").trim().toLowerCase();
 const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 async function resize(file,max=1200){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/webp",.80))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
 async function rpc(name,body={}){const r=await fetch(window.SG_SUPABASE_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify(body),cache:"no-store"});if(!r.ok)throw Error(await r.text());const t=await r.text();try{return t?JSON.parse(t):null}catch(_){return t}}
 function deliveryBox(o){
  if(!o.access_text&&!o.access_note)return "";
  return `<div class="access-delivery"><span class="badge">AKSES SUDAH DIKIRIM</span><h3>Akses Produk</h3><p>${esc(o.access_text||"-")}</p>${o.access_note?`<h3 style="margin-top:16px">Catatan Penting</h3><p>${esc(o.access_note)}</p>`:""}</div>`;
 }
 function paymentBox(o){
   const st=String(o.status||"").toLowerCase();
   if(st.includes("verifikasi")||st.includes("lunas")||st.includes("dibayar")||st.includes("diproses")||st.includes("selesai"))return "";
   return `<div class="note" style="margin-top:18px"><b>Transfer pembayaran</b><p style="margin:10px 0 4px">${BANK_NAME}</p><p style="font-size:24px;font-weight:800;margin:4px 0">${ACCOUNT_NO}</p><p style="margin:4px 0">a.n. ${ACCOUNT_NAME}</p><p style="margin:12px 0"><b>Nominal: Rp ${Number(o.price||0).toLocaleString("id-ID")}</b></p><div class="field"><label>Upload bukti transfer</label><input id="proofFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div id="proofPreview" style="margin-top:10px"></div><button id="paidBtn" class="btn btn-primary" style="width:100%;margin-top:12px" type="button">Kirim Bukti Pembayaran</button><div id="paymsg" style="margin-top:10px"></div></div>`;
 }
 async function submitPaid(invoice){
   const b=$("paidBtn"),m=$("paymsg"),f=$("proofFile")?.files?.[0];if(!b)return;
   if(!f){m.textContent="Pilih foto bukti transfer terlebih dahulu.";return}
   b.disabled=true;b.textContent="Mengirim bukti...";
   try{const proof=await resize(f);await rpc("sg_submit_payment_v6",{p_invoice:invoice,p_proof_data_url:proof});localStorage.setItem("sg_last_invoice",invoice);document.getElementById("result").innerHTML=`<div class="success sg-order-state"><div class="state-icon">✓</div><span class="badge">PESANAN TERKIRIM</span><h2>Menunggu Verifikasi</h2><p>Bukti pembayaran berhasil dikirim ke Solusi Genz.</p><p class="muted">Admin akan memeriksa pembayaran. Setelah akses dikirim, status otomatis berubah menjadi <b>Pesanan Berhasil</b>.</p><p><b>${esc(invoice)}</b></p></div>`}
   catch(err){console.error(err);m.innerHTML="<b>Bukti belum berhasil dikirim.</b> Coba lagi.";b.disabled=false;b.textContent="Kirim Bukti Pembayaran"}
 }
 async function check(){
   const id=$("invoice").value.trim().toUpperCase(),r=$("result");if(!id){r.innerHTML='<div class="note">Masukkan nomor invoice.</div>';return}
   r.innerHTML='<div class="note">Mencari pesanan...</div>';
   try{
     const rows=await rpc("sg_check_order_v6",{p_invoice:id});const o=Array.isArray(rows)?rows[0]:rows;
     if(!o){r.innerHTML='<div class="note">Pesanan tidak ditemukan atau bukan milik akun ini.</div>';return}
     const created=o.created_at?new Date(o.created_at).toLocaleString("id-ID"):"-";
     const done=String(o.status||"").toLowerCase()==="selesai"||!!o.access_text;
     const waiting=String(o.status||"").toLowerCase().includes("verifikasi");
     const stateHtml=done
       ? `<div class="success sg-order-state"><div class="state-icon">✓</div><span class="badge">PESANAN BERHASIL</span><h2>Pesanan Sudah Berhasil</h2><p>Akses produk kamu sudah dikirim.</p><p><b>${esc(o.invoice)}</b></p></div>`
       : waiting
       ? `<div class="success sg-order-state"><div class="state-icon">✓</div><span class="badge">PESANAN TERKIRIM</span><h2>Menunggu Verifikasi</h2><p>Bukti pembayaran sudah diterima dan sedang diperiksa admin.</p><p><b>${esc(o.invoice)}</b></p></div>`
       : `<div class="success sg-order-state">${isNew?'<span class="badge">PESANAN DIBUAT</span>':'<span class="badge">STATUS PESANAN</span>'}<h2>${esc(o.status)}</h2><p><b>${esc(o.invoice)}</b></p><p>${esc(o.product_name)} — Rp ${Number(o.price||0).toLocaleString("id-ID")}</p></div>`;
     r.innerHTML=stateHtml+paymentBox(o)+deliveryBox(o);
     const pf=$("proofFile");if(pf)pf.onchange=async()=>{const f=pf.files[0];if(f){const d=await resize(f,700);$("proofPreview").innerHTML=`<img class="payment-proof" src="${d}">`}};
     const pb=$("paidBtn");if(pb)pb.onclick=()=>submitPaid(o.invoice);
   }catch(err){console.error(err);r.innerHTML='<div class="note"><b>Status belum bisa dibaca.</b> Silakan coba lagi.</div>'}
 }
 $("checkBtn").onclick=check;$("invoice").onkeydown=e=>{if(e.key==="Enter")check()};if(idq){$("invoice").value=idq;check()}sgLoadSettings();
})();
</script></body></html>
