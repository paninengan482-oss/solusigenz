<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>Status Pesanan — Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="solusi-genz-theme.css"></head><body>
<script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script>
<nav class="nav"><div class="container navin"><a class="brand" href="index.html"><span data-sg-logo><img src="solusi-genz-v2.svg"></span></a><a class="btn btn-ghost" href="shop.html">Kembali</a></div></nav>
<div class="container form-wrap"><div class="card form-card"><div class="badge" style="margin-bottom:12px">PESANAN SAYA</div><h1>Pesanan Saya</h1><p class="muted">Status pesanan dan akses produk akan muncul otomatis di sini.</p><div id="result"><div class="note">Memuat pesanan...</div></div></div></div>
<script src="supabase-config.js"></script><script src="store-settings-v14.js"></script>
<script>
(function(){
 const BANK_NAME="Bank Mandiri",ACCOUNT_NAME="DEDE",ACCOUNT_NO="1330035817931";
 const $=id=>document.getElementById(id),token=localStorage.getItem("sg_user_token")||"";
 const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 async function resize(file,max=1200){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/webp",.80))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
 async function rpc(name,body={}){const r=await fetch(window.SG_SUPABASE_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify(body),cache:"no-store"});if(!r.ok)throw Error(await r.text());const t=await r.text();try{return t?JSON.parse(t):null}catch(_){return t}}
 function statusLabel(o){
   const s=String(o.status||"").toLowerCase();
   if(s==="selesai"||s==="berhasil") return "Pesanan Berhasil";
   if(s.includes("verifikasi")) return "Menunggu Verifikasi";
   return o.status||"Menunggu Pembayaran";
 }
 function deliveryBox(o){
   if(!o.access_text&&!o.access_note)return "";
   return `<div class="access-delivery" style="margin-top:16px"><span class="badge">AKSES SUDAH DIKIRIM</span><h3>Akses Produk</h3><p style="white-space:pre-wrap">${esc(o.access_text||"-")}</p>${o.access_note?`<h3 style="margin-top:16px">Catatan Penting</h3><p style="white-space:pre-wrap">${esc(o.access_note)}</p>`:""}</div>`;
 }
 function paymentBox(o){
   const st=String(o.status||"").toLowerCase();
   if(st.includes("verifikasi")||st.includes("lunas")||st.includes("dibayar")||st.includes("diproses")||st.includes("selesai")||st.includes("berhasil"))return "";
   return `<div class="note" style="margin-top:16px"><b>Transfer pembayaran</b><p style="margin:10px 0 4px">${BANK_NAME}</p><p style="font-size:24px;font-weight:800;margin:4px 0">${ACCOUNT_NO}</p><p style="margin:4px 0">a.n. ${ACCOUNT_NAME}</p><p style="margin:12px 0"><b>Nominal: Rp ${Number(o.price||0).toLocaleString("id-ID")}</b></p><div class="field"><label>Upload bukti transfer</label><input class="proofFile" data-invoice="${esc(o.invoice)}" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="proofPreview" data-invoice="${esc(o.invoice)}" style="margin-top:10px"></div><button class="btn btn-primary paidBtn" data-invoice="${esc(o.invoice)}" style="width:100%;margin-top:12px" type="button">Kirim Bukti Pembayaran</button><div class="paymsg" data-invoice="${esc(o.invoice)}" style="margin-top:10px"></div></div>`;
 }
 function orderCard(o){
   const created=o.created_at?new Date(o.created_at).toLocaleString("id-ID"):"-";
   const success=["selesai","berhasil"].includes(String(o.status||"").toLowerCase());
   return `<div class="${success?"success":"note"}" style="margin-top:18px"><b>${success?"✓ PESANAN BERHASIL":"STATUS PESANAN"}</b><h2 style="margin:10px 0">${esc(statusLabel(o))}</h2><p style="font-size:18px"><b>${esc(o.invoice)}</b></p><p>${esc(o.product_name)} — Rp ${Number(o.price||0).toLocaleString("id-ID")}</p><p>Dibuat: ${esc(created)}</p>${o.payment_proof_data_url?`<p><b>Bukti transfer sudah terkirim.</b></p>`:""}${paymentBox(o)}${deliveryBox(o)}</div>`;
 }
 async function submitPaid(invoice,btn){
   const file=document.querySelector(`.proofFile[data-invoice="${CSS.escape(invoice)}"]`)?.files?.[0];
   const msg=document.querySelector(`.paymsg[data-invoice="${CSS.escape(invoice)}"]`);
   if(!file){if(msg)msg.textContent="Pilih foto bukti transfer terlebih dahulu.";return}
   btn.disabled=true;btn.textContent="Mengirim bukti...";
   try{const proof=await resize(file);await rpc("sg_submit_payment_v3",{p_invoice:invoice,p_proof_data_url:proof});if(msg)msg.innerHTML="<b>Bukti berhasil dikirim.</b> Menunggu verifikasi.";setTimeout(loadOrders,600)}
   catch(err){console.error(err);if(msg)msg.innerHTML="<b>Bukti belum berhasil dikirim.</b> Coba lagi.";btn.disabled=false;btn.textContent="Kirim Bukti Pembayaran"}
 }
 function bind(){
   document.querySelectorAll(".proofFile").forEach(el=>el.onchange=async()=>{const f=el.files?.[0];if(!f)return;const d=await resize(f,700),p=document.querySelector(`.proofPreview[data-invoice="${CSS.escape(el.dataset.invoice)}"]`);if(p)p.innerHTML=`<img class="payment-proof" src="${d}">`});
   document.querySelectorAll(".paidBtn").forEach(btn=>btn.onclick=()=>submitPaid(btn.dataset.invoice,btn));
 }
 async function loadOrders(){
   const r=$("result");r.innerHTML='<div class="note">Memuat pesanan...</div>';
   try{
     const rows=await rpc("sg_my_orders_v4",{}),orders=Array.isArray(rows)?rows:[];
     if(!orders.length){r.innerHTML='<div class="note">Belum ada pesanan. Pilih produk untuk mulai order.</div>';return}
     r.innerHTML=orders.map(orderCard).join("");bind();
   }catch(err){console.error(err);r.innerHTML='<div class="note"><b>Pesanan belum bisa dimuat.</b> Silakan refresh halaman.</div>'}
 }
 loadOrders();setInterval(loadOrders,15000);sgLoadSettings();
})();
</script></body></html>
