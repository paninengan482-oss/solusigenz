<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan Saya — Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="v16-core.css"></head><body>
<script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script>
<div class="app-shell"><aside class="sidebar"><a href="shop.html"><img class="sg-logo" src="solusi-genz-v2.svg"></a><nav class="side-nav"><a href="shop.html">Beranda</a><a class="active" href="status.html">Pesanan Saya</a><a href="affiliate.html">Affiliate</a><a href="profile.html">Profil</a></nav></aside>
<main class="main"><header class="topbar"><div><h1>Pesanan Saya</h1><p>Pantau pembayaran, proses, dan akses produk.</p></div></header>
<section class="card panel"><div class="field"><label>Nomor invoice</label><div class="inline-action"><input id="invoice"><button id="checkBtn" class="btn btn-primary">Cek Pesanan</button></div></div><div id="result" style="margin-top:16px"></div></section>
<section class="card panel"><h3>Riwayat Pesanan</h3><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Produk</th><th>Total</th><th>Status</th><th>Tanggal</th><th></th></tr></thead><tbody id="orderRows"></tbody></table></div></section></main></div>
<script src="supabase-config.js"></script><script src="sg-core.js"></script><script>
const token=localStorage.getItem("sg_user_token")||"",money=n=>"Rp "+Number(n||0).toLocaleString("id-ID"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function resize(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.78))};im.onerror=reject;im.src=fr.result};fr.readAsDataURL(file)})}
async function sendProof(inv){const f=document.getElementById("proofFile")?.files?.[0];if(!f){proofMsg.textContent="Pilih foto bukti dulu.";return}proofBtn.disabled=true;proofBtn.textContent="Mengirim...";try{const data=await resize(f);await SGCore.rpc("sg_submit_payment",{p_invoice:inv,p_proof_data_url:data},token,"user");proofMsg.textContent="Bukti terkirim. Menunggu verifikasi Admin.";setTimeout(check,500)}catch(e){if(e.message!=="SESSION_EXPIRED"){proofMsg.textContent="Bukti belum terkirim.";proofBtn.disabled=false;proofBtn.textContent="Kirim Bukti"}}}
async function check(){const inv=invoice.value.trim().toUpperCase();if(!inv)return;result.innerHTML='<div class="notice">Memuat...</div>';try{const rows=await SGCore.rpc("sg_my_order_details",{p_invoice:inv},token,"user"),o=rows?.[0];if(!o){result.innerHTML='<div class="notice">Pesanan tidak ditemukan.</div>';return}
const canPay=["Menunggu Pembayaran","Bermasalah","pending"].includes(o.status);
const access=o.access_sent_at?`<div class="access-box"><span class="badge">AKSES PRODUK</span><h3>${esc(o.product_name)}</h3><p><b>Username/Email:</b> ${esc(o.access_username||"-")}</p><p><b>Password:</b> ${esc(o.access_password||"-")}</p><p><b>Petunjuk:</b> ${esc(o.access_instructions||"-")}</p><p><b>Masa aktif:</b> ${o.access_expires_at?new Date(o.access_expires_at).toLocaleString("id-ID"):"Sesuai paket"}</p></div>`:"";
const payment=canPay?`<div class="payment-panel"><h3>Transfer Pembayaran</h3><p>Bank Mandiri</p><div class="account-number">1330035817931</div><p>a.n. DEDE</p><p><b>Nominal: ${money(o.price)}</b></p>${o.payment_rejection_reason?`<div class="notice">${esc(o.payment_rejection_reason)}</div>`:""}<div class="field"><label>Upload Bukti Pembayaran</label><input id="proofFile" type="file" accept="image/*"></div><button id="proofBtn" class="btn btn-primary" style="width:100%;margin-top:10px">Kirim Bukti</button><div id="proofMsg" class="muted"></div></div>`:"";
result.innerHTML=`<div class="order-detail"><span class="pill">${esc(o.status)}</span><h2>${esc(o.invoice)}</h2><p>${esc(o.product_name)} · ${money(o.price)}</p>${payment}${access}</div>`;if(document.getElementById("proofBtn"))proofBtn.onclick=()=>sendProof(o.invoice)}
catch(e){if(e.message!=="SESSION_EXPIRED")result.innerHTML='<div class="notice">Pesanan belum bisa dibaca.</div>'}}
async function load(){try{const rows=await SGCore.rpc("sg_my_orders",{},token,"user");orderRows.innerHTML=rows.length?rows.map(o=>`<tr><td><b>${esc(o.invoice)}</b></td><td>${esc(o.product_name)}</td><td>${money(o.price)}</td><td><span class="pill">${esc(o.status)}</span></td><td>${new Date(o.created_at).toLocaleDateString("id-ID")}</td><td><button class="btn-mini open" data-id="${esc(o.invoice)}">Buka</button></td></tr>`).join(""):'<tr><td colspan="6">Belum ada pesanan.</td></tr>';document.querySelectorAll(".open").forEach(b=>b.onclick=()=>{invoice.value=b.dataset.id;check()})}catch(e){}}
checkBtn.onclick=check;const q=new URLSearchParams(location.search);if(q.get("id")){invoice.value=q.get("id");check()}load();
</script></body></html>
