<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan Saya — Solusi Genz</title><link rel="stylesheet" href="revamp.css"></head><body><script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script>
<div class="app-shell"><aside class="sidebar"><a href="shop.html"><img class="sg-logo" src="solusi-genz-v2.svg"></a><nav class="side-nav"><a href="shop.html">Beranda</a><a class="active" href="status.html">Pesanan Saya</a><a href="affiliate.html">Affiliate</a><a href="profile.html">Profil</a></nav></aside><main class="main"><header class="topbar"><div><h1>Pesanan Saya</h1><p>Pantau pembayaran, proses, dan akses produk.</p></div></header><section class="card panel"><div class="field"><label>Nomor invoice</label><div class="inline-action"><input id="invoice" placeholder="SGZ-..."><button id="checkBtn" class="btn btn-primary">Cek Pesanan</button></div></div><div id="result" style="margin-top:16px"></div></section><section class="card panel"><h3>Riwayat Pesanan</h3><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Produk</th><th>Total</th><th>Status</th><th>Tanggal</th><th></th></tr></thead><tbody id="orderRows"><tr><td colspan="6">Memuat...</td></tr></tbody></table></div></section></main></div>
<script src="supabase-config.js"></script><script>
const token=localStorage.getItem("sg_user_token")||"",$=id=>document.getElementById(id),money=n=>"Rp "+Number(n||0).toLocaleString("id-ID"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function rpc(name,body={}){const r=await fetch(window.SG_SUPABASE_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify(body),cache:"no-store"});if(!r.ok)throw Error(await r.text());return r.json()}function resize(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.78))};im.onerror=reject;im.src=fr.result};fr.readAsDataURL(file)})}function statusClass(s){s=String(s||"").toLowerCase();return s.includes("selesai")?"ok-pill":s.includes("bermasalah")||s.includes("batal")?"danger-pill":s.includes("verifikasi")?"warn-pill":"pill"}
async function sendProof(inv){const f=$("proofFile")?.files?.[0];if(!f){$("proofMsg").textContent="Pilih foto bukti pembayaran dulu.";return}const b=$("proofBtn");b.disabled=true;b.textContent="Mengirim...";try{const data=await resize(f);await rpc("sg_submit_payment",{p_invoice:inv,p_proof_data_url:data});$("proofMsg").textContent="Bukti terkirim. Menunggu verifikasi Admin.";setTimeout(check,500)}catch(e){$("proofMsg").textContent="Bukti belum terkirim: "+(e.message||"coba lagi");b.disabled=false;b.textContent="Kirim Bukti"}}
async function check(){const inv=$("invoice").value.trim().toUpperCase();if(!inv)return;$("result").innerHTML='<div class="notice">Memuat pesanan...</div>';try{const rows=await rpc("sg_my_order_details",{p_invoice:inv}),o=rows?.[0];if(!o){$("result").innerHTML='<div class="notice">Pesanan tidak ditemukan pada akun ini.</div>';return}const canPay=["Menunggu Pembayaran","Bermasalah","pending"].includes(o.status);const access=o.access_sent_at?`<div class="access-box"><span class="badge">AKSES PRODUK</span><h3>${esc(o.product_name)}</h3><p><b>Username/Email:</b> ${esc(o.access_username||"-")}</p><p><b>Password:</b> <span class="secret-text">${esc(o.access_password||"-")}</span></p><p><b>Petunjuk:</b> ${esc(o.access_instructions||"-")}</p><p><b>Masa aktif sampai:</b> ${o.access_expires_at?new Date(o.access_expires_at).toLocaleString("id-ID"):"Sesuai paket"}</p><a class="btn btn-ghost" href="https://wa.me/" target="_blank" rel="noopener">Akses Bermasalah / Butuh Bantuan</a></div>`:"";const reject=o.payment_rejection_reason?`<div class="notice danger-note"><b>Bukti perlu diperbaiki:</b> ${esc(o.payment_rejection_reason)}</div>`:"";const payment=canPay?`<div class="payment-panel"><h3>Transfer Pembayaran</h3><p>Bank Mandiri</p><div class="account-number">1330035817931</div><p>a.n. DEDE</p><p><b>Nominal: ${money(o.price)}</b></p>${reject}<div class="field"><label>Upload Bukti Pembayaran</label><input id="proofFile" type="file" accept="image/*"></div><button id="proofBtn" class="btn btn-primary" style="width:100%;margin-top:10px">Kirim Bukti</button><div id="proofMsg" class="muted" style="margin-top:8px"></div></div>`:"";$("result").innerHTML=`<div class="order-detail"><div><span class="${statusClass(o.status)}">${esc(o.status)}</span><h2>${esc(o.invoice)}</h2><p>${esc(o.product_name)} · ${money(o.price)}</p><p class="muted">${new Date(o.created_at).toLocaleString("id-ID")}</p></div>${payment}${access}</div>`;if($("proofBtn"))$("proofBtn").onclick=()=>sendProof(o.invoice)}catch(e){console.error(e);$("result").innerHTML='<div class="notice">Pesanan belum bisa dibaca. Pastikan SQL V15 sudah dijalankan.</div>'}}
async function loadOrders(){try{const rows=await rpc("sg_my_orders");orderRows.innerHTML=rows.length?rows.map(o=>`<tr><td><b>${esc(o.invoice)}</b></td><td>${esc(o.product_name)}</td><td>${money(o.price)}</td><td><span class="${statusClass(o.status)}">${esc(o.status)}</span></td><td>${new Date(o.created_at).toLocaleDateString("id-ID")}</td><td><button class="open-order btn-mini" data-id="${esc(o.invoice)}">Buka</button></td></tr>`).join(""):'<tr><td colspan="6">Belum ada pesanan.</td></tr>';document.querySelectorAll(".open-order").forEach(b=>b.onclick=()=>{$("invoice").value=b.dataset.id;check();scrollTo({top:0,behavior:"smooth"})})}catch(e){orderRows.innerHTML='<tr><td colspan="6">Jalankan SQL V15 untuk mengaktifkan riwayat.</td></tr>'}}
checkBtn.onclick=check;invoice.onkeydown=e=>{if(e.key==="Enter")check()};const q=new URLSearchParams(location.search);if(q.get("id")){invoice.value=q.get("id");check()}loadOrders();
</script></body></html>
