<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pesanan — Solusi Genz</title><link rel="stylesheet" href="styles.css"></head><body>
<nav class="nav"><div class="container navin"><a class="brand" href="index.html"><div class="logo">S</div><div>SOLUSI GENZ</div></a><a class="btn btn-ghost" href="index.html">Beranda</a></div></nav>
<div class="container form-wrap"><div class="card form-card"><div class="badge" style="margin-bottom:12px">PEMBAYARAN MANDIRI</div><h1>Status & Pembayaran</h1><div class="field"><label>Nomor invoice</label><div style="display:flex;gap:10px"><input id="invoice" placeholder="Contoh: SGZ-A1B2C3D4E5F6"><button id="checkBtn" class="btn btn-primary" type="button">Cek</button></div></div><div id="result"></div></div></div>
<script src="supabase-config.js"></script>
<script>
(function(){
 const BANK_NAME='Bank Mandiri', ACCOUNT_NAME='DEDE', ACCOUNT_NO='1330035817931';
 const $=id=>document.getElementById(id); const qs=new URLSearchParams(location.search), idq=qs.get('id'), isNew=qs.get('new')==='1'; const token=localStorage.getItem('sg_user_token')||'', uid=localStorage.getItem('sg_user_id')||'', myEmail=(localStorage.getItem('sg_user_email')||'').trim().toLowerCase();
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 async function repairAffiliate(o){
   if(!token||!o||!myEmail||String(o.email||'').trim().toLowerCase()!==myEmail)return;
   try{
     let ref=(localStorage.getItem('sg_ref_code')||'').trim().toUpperCase();
     if(!ref){const ur=await fetch(window.SG_SUPABASE_URL+'/auth/v1/user',{headers:{'apikey':window.SG_SUPABASE_KEY,'Authorization':'Bearer '+token}});if(ur.ok){const u=await ur.json();ref=(u?.user_metadata?.referral_code||'').trim().toUpperCase();if(ref)localStorage.setItem('sg_ref_code',ref)}}
     if(ref)await fetch(window.SG_SUPABASE_URL+'/rest/v1/rpc/sg_affiliate_attach_referral',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SG_SUPABASE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({p_buyer_email:myEmail,p_buyer_user_id:uid||null,p_referral_code:ref})});
     await fetch(window.SG_SUPABASE_URL+'/rest/v1/rpc/sg_affiliate_sync_self',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SG_SUPABASE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({p_email:myEmail})});
     await fetch(window.SG_SUPABASE_URL+'/rest/v1/rpc/sg_affiliate_attach_order',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SG_SUPABASE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({p_invoice:o.invoice,p_buyer_user_id:uid||null,p_buyer_email:myEmail})});
   }catch(_){ }
 }

 function paymentBox(o){
   const st=String(o.status||'').toLowerCase();
   if(st.includes('verifikasi')||st.includes('lunas')||st.includes('dibayar')||st.includes('diproses')||st.includes('selesai')) return '';
   return `<div class="note" style="margin-top:18px"><b>Transfer pembayaran</b><p style="margin:10px 0 4px">${BANK_NAME}</p><p style="font-size:24px;font-weight:800;margin:4px 0">${ACCOUNT_NO}</p><p style="margin:4px 0">a.n. ${ACCOUNT_NAME}</p><p style="margin:12px 0"><b>Nominal: Rp ${Number(o.price||0).toLocaleString('id-ID')}</b></p><p>Transfer sesuai nominal di atas, lalu tekan tombol berikut.</p><button id="paidBtn" class="btn btn-primary" style="width:100%;margin-top:8px" type="button">Saya Sudah Bayar</button><div id="paymsg" style="margin-top:10px"></div></div>`;
 }
 async function submitPaid(invoice){
   const b=$('paidBtn'), m=$('paymsg'); if(!b)return; b.disabled=true;b.textContent='Mengirim konfirmasi...';
   try{
     const res=await fetch(window.SG_SUPABASE_URL+'/rest/v1/rpc/sg_submit_payment',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SG_SUPABASE_KEY,'Authorization':'Bearer '+window.SG_SUPABASE_KEY},body:JSON.stringify({p_invoice:invoice})});
     const txt=await res.text(); if(!res.ok)throw new Error(txt||('HTTP '+res.status));
     m.innerHTML='<b>Konfirmasi terkirim.</b> Status pesanan menjadi Menunggu Verifikasi.'; setTimeout(check,700);
   }catch(err){console.error('SG_PAYMENT_ERROR',err);m.innerHTML='<b>Konfirmasi belum terkirim.</b> Coba sekali lagi.';b.disabled=false;b.textContent='Saya Sudah Bayar';}
 }
 async function check(){
   const id=$('invoice').value.trim().toUpperCase(), r=$('result'); if(!id){r.innerHTML='<div class="note">Masukkan nomor invoice.</div>';return}
   r.innerHTML='<div class="note">Mencari pesanan di database...</div>';
   try{
     const res=await fetch(window.SG_SUPABASE_URL+'/rest/v1/rpc/sg_check_order',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SG_SUPABASE_KEY,'Authorization':'Bearer '+window.SG_SUPABASE_KEY},body:JSON.stringify({p_invoice:id})});
     const txt=await res.text(); if(!res.ok) throw new Error(txt||('HTTP '+res.status)); const rows=txt?JSON.parse(txt):[]; const o=rows&&rows[0];
     if(!o){r.innerHTML='<div class="note">Pesanan tidak ditemukan.</div>';return}
     await repairAffiliate(o);
     const created=o.created_at?new Date(o.created_at).toLocaleString('id-ID'):'-';
     r.innerHTML=`<div class="success">${isNew?'<b>✓ PESANAN BERHASIL DIBUAT</b>':'<b>Pesanan ditemukan</b>'}<h2 style="margin:10px 0">${esc(o.status)}</h2><p style="font-size:18px"><b>${esc(o.invoice)}</b></p><p>${esc(o.product_name)} — Rp ${Number(o.price||0).toLocaleString('id-ID')}</p><p>Nama: ${esc(o.customer_name)}<br>Metode: ${esc(o.payment_method)}<br>Dibuat: ${esc(created)}</p></div>${paymentBox(o)}`;
     const pb=$('paidBtn'); if(pb)pb.addEventListener('click',()=>submitPaid(o.invoice));
   }catch(err){console.error('SG_STATUS_ERROR',err);r.innerHTML='<div class="note"><b>Status belum bisa dibaca.</b> Silakan coba lagi.</div>'}
 }
 $('checkBtn').addEventListener('click',check); $('invoice').addEventListener('keydown',e=>{if(e.key==='Enter')check()}); if(idq){$('invoice').value=idq;check()}
})();
</script></body></html>
