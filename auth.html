<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akun — Solusi Genz</title><link rel="stylesheet" href="launch.css"></head><body><main class="auth-page"><section class="card auth-card"><a class="auth-logo" href="index.html"><span class="sg-dot">SG</span><span class="brand-copy"><strong>SOLUSI GENZ</strong><small>Digital Product Store</small></span></a><span class="kicker">AKUN PELANGGAN</span><h1 id="title">Selamat datang kembali.</h1><p class="muted" id="subtitle">Masuk untuk membuka dashboard pelanggan.</p><div id="nameField" class="field" style="display:none"><label>Nama lengkap</label><input id="name" autocomplete="name"></div><div class="field" style="margin-top:14px"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="submit" class="btn btn-primary" style="width:100%;margin-top:18px">Masuk</button><div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="muted" id="switch">Belum punya akun? <a href="auth.html?mode=register"><b>Daftar</b></a></p></section></main><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),reg=q.get('mode')==='register',ref=(q.get('ref')||localStorage.getItem('sg_ref_code')||'').trim().toUpperCase();if(ref)localStorage.setItem('sg_ref_code',ref);if(reg){title.textContent='Buat akun Solusi Genz.';subtitle.textContent=ref?'Daftar melalui kode undangan affiliate.':'Daftar untuk mulai melihat produk dan membuat pesanan.';nameField.style.display='grid';submit.textContent='Buat Akun';document.getElementById('switch').innerHTML='Sudah punya akun? <a href="auth.html"><b>Masuk</b></a>'}async function req(path,body,token=''){const h={'Content-Type':'application/json','apikey':SG_SUPABASE_KEY};if(token)h.Authorization='Bearer '+token;return fetch(SG_SUPABASE_URL+path,{method:'POST',headers:h,body:JSON.stringify(body)})}function show(m){msg.textContent=m;msg.style.display='block'}submit.onclick=async()=>{const em=email.value.trim(),pw=password.value,n=name.value.trim();if(!em||pw.length<6||(reg&&!n))return show('Lengkapi data. Password minimal 6 karakter.');submit.disabled=true;try{const r=await req(reg?'/auth/v1/signup':'/auth/v1/token?grant_type=password',reg?{email:em,password:pw,data:{full_name:n,referral_code:ref||null}}:{email:em,password:pw});const t=await r.text();if(!r.ok)throw Error(t);const d=JSON.parse(t);if(!d.access_token)return show('Akun dibuat. Silakan cek email bila verifikasi email aktif, lalu masuk.');localStorage.setItem('sg_user_token',d.access_token);localStorage.setItem('sg_user_email',em);localStorage.setItem('sg_user_name',n||d.user?.user_metadata?.full_name||em.split('@')[0]);localStorage.setItem('sg_user_id',d.user?.id||'');if(ref)try{await req('/rest/v1/rpc/sg_affiliate_attach_referral',{p_buyer_email:em,p_buyer_user_id:d.user?.id||null,p_referral_code:ref},d.access_token)}catch(_){}location.replace('shop.html')}catch(e){show(reg?'Pendaftaran belum berhasil. Email mungkin sudah terdaftar.':'Email atau password salah.')}finally{submit.disabled=false;submit.textContent=reg?'Buat Akun':'Masuk'}};
</script></body></html>
