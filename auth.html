<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="v16-core.css"></head><body>
<main class="auth-wrap"><section class="card auth-card"><a href="index.html"><img class="auth-logo" src="solusi-genz-v2.svg" alt="Solusi Genz"></a><span class="badge">AKUN SOLUSI GENZ</span><h1 id="title">Selamat datang kembali.</h1><p class="muted" id="subtitle">Masuk menggunakan Email / ID dan password.</p>
<div id="nameField" class="field" style="display:none"><label>Nama lengkap</label><input id="name"></div>
<div class="field" style="margin-top:14px"><label>Email / ID</label><input id="email" type="text" autocomplete="username" placeholder="Email atau ID"></div>
<div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button id="submit" class="btn btn-primary" style="width:100%;margin-top:18px">Masuk</button>
<button id="forgotBtn" class="btn btn-ghost" type="button" style="width:100%;margin-top:10px">Lupa / Reset Password</button>
<div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="muted" id="switch">Belum punya akun? <a href="auth.html?mode=register"><b>Buat Akun</b></a></p></section></main>
<script src="supabase-config.js"></script><script src="sg-core.js"></script><script>
const $=id=>document.getElementById(id);
const ADMIN_ALIAS="Adminsolusi123";
const ADMIN_EMAIL="paninengan482@gmail.com";
const q=new URLSearchParams(location.search), reg=q.get("mode")==="register";

function show(s,ok=false){
  const m=$("msg");
  m.textContent=s;
  m.style.display="block";
  m.style.borderColor=ok?"#86efac":"";
}

if(q.get("expired")==="1") show("Sesi login berakhir. Silakan masuk kembali.");

if(reg){
  $("title").textContent="Buat akun Solusi Genz.";
  $("subtitle").textContent="Daftar sekali untuk belanja dan melihat pesanan.";
  $("nameField").style.display="flex";
  $("submit").textContent="Buat Akun";
  $("forgotBtn").style.display="none";
  $("switch").innerHTML='Sudah punya akun? <a href="auth.html"><b>Masuk</b></a>';
}

async function authReq(path,body){
  const r=await fetch(window.SG_SUPABASE_URL+path,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY},
    body:JSON.stringify(body)
  });
  const raw=await r.text();
  if(!r.ok) throw new Error(raw);
  return raw?JSON.parse(raw):{};
}

$("submit").onclick=async()=>{
  const loginId=$("email").value.trim();
  const pw=$("password").value;
  const n=$("name").value.trim();

  if(!loginId||pw.length<6||(reg&&!n)){
    show("Lengkapi data. Password minimal 6 karakter.");
    return;
  }

  $("submit").disabled=true;
  $("submit").textContent="Memproses...";

  try{
    if(reg){
      const d=await authReq("/auth/v1/signup",{email:loginId,password:pw,data:{full_name:n}});
      if(d.access_token){
        localStorage.setItem("sg_user_token",d.access_token);
        localStorage.setItem("sg_user_email",loginId);
        localStorage.setItem("sg_user_name",n);
        localStorage.setItem("sg_user_id",d.user?.id||"");
        location.replace("shop.html");
        return;
      }
      show("Akun dibuat. Silakan masuk.",true);
    }else{
      const lower=loginId.toLowerCase();
      const isAdminLogin =
        lower===ADMIN_ALIAS.toLowerCase() ||
        lower===ADMIN_EMAIL.toLowerCase();

      const em = lower===ADMIN_ALIAS.toLowerCase() ? ADMIN_EMAIL : loginId;

      const d=await authReq("/auth/v1/token?grant_type=password",{email:em,password:pw});

      if(isAdminLogin){
        // Tidak melakukan preflight RPC di halaman login.
        // Simpan sesi dulu, lalu Dashboard Admin yang akan menangani data.
        SGCore.clearUser();
        sessionStorage.setItem("sg_admin_token",d.access_token);
        sessionStorage.setItem("sg_admin_email",ADMIN_EMAIL);
        location.replace("admin.html");
        return;
      }

      localStorage.setItem("sg_user_token",d.access_token);
      localStorage.setItem("sg_user_email",em);
      localStorage.setItem("sg_user_name",d.user?.user_metadata?.full_name||em.split("@")[0]);
      localStorage.setItem("sg_user_id",d.user?.id||"");
      location.replace("shop.html");
    }
  }catch(e){
    console.error(e);
    show(reg
      ?"Pendaftaran belum berhasil. Email mungkin sudah terdaftar."
      :"Email/ID atau password salah."
    );
  }finally{
    $("submit").disabled=false;
    $("submit").textContent=reg?"Buat Akun":"Masuk";
  }
};

$("forgotBtn").onclick=async()=>{
  let em=$("email").value.trim();

  if(em.toLowerCase()===ADMIN_ALIAS.toLowerCase()){
    em=ADMIN_EMAIL;
  }

  if(!em||!em.includes("@")){
    show("Masukkan email akun untuk reset password.");
    return;
  }

  $("forgotBtn").disabled=true;
  $("forgotBtn").textContent="Mengirim...";

  try{
    await authReq("/auth/v1/recover",{
      email:em,
      redirect_to:location.origin+"/reset-password.html"
    });
    show("Email reset terkirim. Buka email terbaru.",true);
  }catch(e){
    show("Reset belum berhasil dikirim.");
  }finally{
    $("forgotBtn").disabled=false;
    $("forgotBtn").textContent="Lupa / Reset Password";
  }
};

$("password").addEventListener("keydown",e=>{
  if(e.key==="Enter") $("submit").click();
});
</script></body></html>
