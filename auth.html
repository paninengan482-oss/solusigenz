<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — Solusi Genz</title><link rel="stylesheet" href="revamp.css"></head><body><main class="auth-wrap"><section class="card auth-card"><a href="index.html"><img class="auth-logo" src="solusi-genz-v2.svg" alt="Solusi Genz"></a><span class="badge">AKUN SOLUSI GENZ</span><h1 id="title">Selamat datang kembali.</h1><p class="muted" id="subtitle">Masuk dengan email dan password. Akun Admin akan diarahkan otomatis ke Dashboard Admin.</p><div id="nameField" class="field" style="display:none"><label>Nama lengkap</label><input id="name" autocomplete="name"></div><div class="field" style="margin-top:14px"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="submit" class="btn btn-primary" style="width:100%;margin-top:18px">Masuk</button><button id="forgotBtn" class="btn btn-ghost" type="button" style="width:100%;margin-top:10px">Lupa / Reset Password</button><div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="muted" id="switch">Belum punya akun? <a href="auth.html?mode=register"><b>Buat Akun</b></a></p></section></main><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id),titleEl=$("title"),subtitleEl=$("subtitle"),nameFieldEl=$("nameField"),nameEl=$("name"),emailEl=$("email"),passwordEl=$("password"),submitEl=$("submit"),forgotBtn=$("forgotBtn"),msgEl=$("msg"),switchEl=$("switch");
const q=new URLSearchParams(location.search),reg=q.get("mode")==="register",urlRef=(q.get("ref")||"").trim().toUpperCase(),savedRef=(localStorage.getItem("sg_ref_code")||"").trim().toUpperCase(),ref=urlRef||savedRef;if(ref)localStorage.setItem("sg_ref_code",ref);
if(reg){titleEl.textContent="Buat akun Solusi Genz.";subtitleEl.textContent=ref?"Daftar melalui link referral.":"Daftar sekali untuk belanja, melihat pesanan, affiliate, dan mengatur akun.";nameFieldEl.style.display="flex";submitEl.textContent="Buat Akun";forgotBtn.style.display="none";switchEl.innerHTML='Sudah punya akun? <a href="auth.html'+(ref?'?ref='+encodeURIComponent(ref):'')+'"><b>Masuk</b></a>'}
async function req(path,body,token=""){const headers={"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY};if(token)headers.Authorization="Bearer "+token;return fetch(window.SG_SUPABASE_URL+path,{method:"POST",headers,body:JSON.stringify(body)})}
function show(s,ok=false){msgEl.textContent=s;msgEl.style.display="block";msgEl.style.borderColor=ok?"#86efac":""}
async function attachReferral(em,userId,token,code=""){const effective=(code||ref||"").trim().toUpperCase();if(!effective||!token)return false;try{const r=await req("/rest/v1/rpc/sg_affiliate_attach_referral",{p_buyer_email:em,p_buyer_user_id:userId||null,p_referral_code:effective},token);if(r.ok){localStorage.setItem("sg_ref_attached",effective);localStorage.setItem("sg_ref_code",effective);return true}}catch(_){ }return false}
async function isAdmin(token){try{const r=await req("/rest/v1/rpc/sg_admin_list_orders",{},token);return r.ok}catch(_){return false}}
forgotBtn.onclick=async()=>{const em=emailEl.value.trim();if(!em){show("Masukkan email akun terlebih dahulu, lalu tekan Reset Password.");emailEl.focus();return}forgotBtn.disabled=true;forgotBtn.textContent="Mengirim link reset...";try{const redirect=location.origin+"/reset-password.html";const r=await req("/auth/v1/recover",{email:em,redirect_to:redirect});if(!r.ok)throw Error(await r.text());show("Link reset password sudah dikirim ke email. Buka email terbaru dari Solusi Genz/Supabase.",true)}catch(e){show("Link reset belum dapat dikirim. Pastikan email benar dan Redirect URL Supabase sudah mengizinkan halaman reset-password.html.")}finally{forgotBtn.disabled=false;forgotBtn.textContent="Lupa / Reset Password"}};
submitEl.onclick=async()=>{const em=emailEl.value.trim(),pw=passwordEl.value,n=nameEl.value.trim();if(!em||pw.length<6||(reg&&!n)){show("Lengkapi data. Password minimal 6 karakter.");return}submitEl.disabled=true;submitEl.textContent="Memproses...";try{const body=reg?{email:em,password:pw,data:{full_name:n,referral_code:ref||null}}:{email:em,password:pw};const r=await req(reg?"/auth/v1/signup":"/auth/v1/token?grant_type=password",body);const t=await r.text();if(!r.ok)throw Error(t);const d=JSON.parse(t);if(d.access_token){if(!reg && await isAdmin(d.access_token)){sessionStorage.setItem("sg_admin_token",d.access_token);sessionStorage.setItem("sg_admin_email",em);localStorage.removeItem("sg_user_token");location.replace("admin.html");return}localStorage.setItem("sg_user_token",d.access_token);localStorage.setItem("sg_user_email",em);localStorage.setItem("sg_user_name",reg?n:(d.user?.user_metadata?.full_name||em.split("@")[0]));localStorage.setItem("sg_user_id",d.user?.id||"");const metaRef=(d.user?.user_metadata?.referral_code||ref||"").trim().toUpperCase();if(metaRef)localStorage.setItem("sg_ref_code",metaRef);await attachReferral(em,d.user?.id||"",d.access_token,metaRef);try{await req("/rest/v1/rpc/sg_affiliate_sync_self",{p_email:em},d.access_token)}catch(_){ }location.replace("shop.html")}else show("Akun dibuat. Silakan masuk menggunakan email dan password yang didaftarkan.",true)}catch(e){show(reg?"Pendaftaran belum berhasil. Email mungkin sudah terdaftar.":"Email atau password salah.")}finally{submitEl.disabled=false;submitEl.textContent=reg?"Buat Akun":"Masuk"}};
passwordEl.addEventListener("keydown",e=>{if(e.key==="Enter")submitEl.click()});
</script></body></html>
