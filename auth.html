<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07162f"><title>Akun — Solusi Genz</title><link rel="stylesheet" href="styles.css"></head><body class="authbody"><div class="authshell"><a class="brand authbrand" href="index.html"><div class="logo">S</div><div>SOLUSI GENZ</div></a><div class="authcard card"><span class="badge">AKUN PELANGGAN</span><h1 id="title">Selamat datang kembali.</h1><p id="subtitle">Masuk untuk membuka dashboard dan katalog Solusi Genz.</p><div id="nameField" class="field hidden"><label>Nama lengkap</label><input id="name" autocomplete="name" placeholder="Nama lengkap"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="nama@email.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter"></div><button id="submit" class="btn btn-primary wide">Masuk</button><div id="msg" class="note hidden"></div><p class="switch" id="switch">Belum punya akun? <a href="auth.html?mode=register">Daftar gratis</a></p></div></div><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x), reg=new URLSearchParams(location.search).get('mode')==='register';
if(reg){$('title').textContent='Buat akun Solusi Genz.';$('subtitle').textContent='Daftar sekali, lalu akses katalog dan pesananmu kapan saja.';$('nameField').classList.remove('hidden');$('submit').textContent='Buat Akun';$('switch').innerHTML='Sudah punya akun? <a href="auth.html">Masuk</a>'}
async function req(path,body){return fetch(window.SG_SUPABASE_URL+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SG_SUPABASE_KEY},body:JSON.stringify(body)})}
$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!email||password.length<6||(reg&&!name)){show('Lengkapi data. Password minimal 6 karakter.');return}$('submit').disabled=true;$('submit').textContent='Memproses...';try{const r=await req(reg?'/auth/v1/signup':'/auth/v1/token?grant_type=password',reg?{email,password,data:{full_name:name}}:{email,password});const t=await r.text();if(!r.ok)throw Error(t);const d=JSON.parse(t);if(d.access_token){localStorage.setItem('sg_user_token',d.access_token);localStorage.setItem('sg_user_email',email);localStorage.setItem('sg_user_name',reg?name:(d.user?.user_metadata?.full_name||email.split('@')[0]));location.replace('shop.html')}else show('Akun dibuat. Jika konfirmasi email aktif, cek email lalu masuk.')}catch(e){show(reg?'Pendaftaran belum berhasil. Email mungkin sudah terdaftar.':'Email atau password salah.')}finally{$('submit').disabled=false;$('submit').textContent=reg?'Buat Akun':'Masuk'}};function show(s){$('msg').textContent=s;$('msg').classList.remove('hidden')}
</script></body></html>
