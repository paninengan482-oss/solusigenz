<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>Masuk — Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="solusi-genz-theme.css"></head><body>
<main class="auth-wrap"><section class="card auth-card auth-v4">
  <div class="auth-logo-center"><a href="index.html"><img class="auth-logo" src="solusi-genz-v2.svg" alt="Solusi Genz"></a></div>
  <h1 id="title">Hallo, sudah punya akun?</h1>
  <p class="muted" id="subtitle">Silahkan masukan email & password nya ya…</p>

  <div id="nameField" class="field" style="display:none"><label>Nama lengkap</label><input id="name" autocomplete="name"></div>
  <div class="field" style="margin-top:14px"><label id="identityLabel">Email</label><input id="email" autocomplete="username" placeholder="Email"></div>
  <div id="passwordField" class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
  <button id="submit" class="btn btn-primary" style="width:100%;margin-top:18px">Masuk</button>
  <div id="msg" class="notice" style="display:none;margin-top:14px"></div>
  <p id="forgotLine" class="muted" style="margin:14px 0 0"><a href="auth.html?mode=forgot"><b>Lupa password?</b></a></p>
  <p class="muted" id="switch">Belum punya akun? <a href="auth.html?mode=register"><b>Daftar gratis</b></a></p>
</section></main>

<script src="supabase-config.js"></script>
<script>
const $=id=>document.getElementById(id),titleEl=$("title"),subtitleEl=$("subtitle"),nameFieldEl=$("nameField"),nameEl=$("name"),emailEl=$("email"),passwordEl=$("password"),passwordFieldEl=$("passwordField"),submitEl=$("submit"),msgEl=$("msg"),switchEl=$("switch"),forgotLineEl=$("forgotLine"),identityLabel=$("identityLabel");
const PERFORMANCE_ID="ADMINSOLUSI123",PERFORMANCE_EMAIL="paninengan482@gmail.com";
const q=new URLSearchParams(location.search),mode=q.get("mode")||"login",reg=mode==="register",forgot=mode==="forgot";
const urlRef=(q.get("ref")||"").trim().toUpperCase(),savedRef=(localStorage.getItem("sg_ref_code")||"").trim().toUpperCase(),ref=urlRef||savedRef;
if(ref)localStorage.setItem("sg_ref_code",ref);

if(reg){
 titleEl.textContent="Buat akun Solusi Genz";
 subtitleEl.textContent="Isi data berikut untuk mulai belanja produk digital.";
 nameFieldEl.style.display="flex";submitEl.textContent="Buat Akun";forgotLineEl.style.display="none";
 switchEl.innerHTML='Sudah punya akun? <a href="auth.html"><b>Masuk</b></a>';
}
if(forgot){
 titleEl.textContent="Lupa password?";
 subtitleEl.textContent="Masukkan email akun kamu. Link reset password akan dikirim melalui email.";
 passwordFieldEl.style.display="none";nameFieldEl.style.display="none";submitEl.textContent="Kirim Link Reset";
 forgotLineEl.style.display="none";switchEl.innerHTML='Ingat password? <a href="auth.html"><b>Kembali masuk</b></a>';
 identityLabel.textContent="Email";emailEl.placeholder="Email";
}else if(!reg){
 identityLabel.textContent="Email / ID";emailEl.placeholder="Email";
}

async function req(path,body,token=""){
 const headers={"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY};
 if(token)headers.Authorization="Bearer "+token;
 return fetch(window.SG_SUPABASE_URL+path,{method:"POST",headers,body:JSON.stringify(body)})
}
function show(s,ok=false){msgEl.textContent=s;msgEl.style.display="block";msgEl.className=ok?"notice ok":"notice"}
async function attachAffiliate(em,userId,token,code=""){
 const effective=(code||ref||"").trim().toUpperCase();if(!effective||!token)return false;
 try{
  const r=await req("/rest/v1/rpc/sg_affiliate_attach_referral",{p_buyer_email:em,p_buyer_user_id:userId||null,p_referral_code:effective},token);
  if(r.ok){localStorage.setItem("sg_ref_attached",effective);return true}
 }catch(_){}
 return false
}
submitEl.onclick=async()=>{
 const raw=emailEl.value.trim(),rawUpper=raw.toUpperCase();
 if(!raw){show("Masukkan email atau ID.");return}

 if(forgot){
   const em=raw;
   if(rawUpper===PERFORMANCE_ID){show("Untuk reset password performa, gunakan email yang terhubung.");return}
   submitEl.disabled=true;submitEl.textContent="Mengirim...";
   try{
     const redirect=location.origin+"/reset-password.html";
     const r=await fetch(window.SG_SUPABASE_URL+"/auth/v1/recover?redirect_to="+encodeURIComponent(redirect),{method:"POST",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY},body:JSON.stringify({email:em})});
     if(!r.ok)throw Error(await r.text());
     show("Link reset password sudah dikirim. Cek inbox atau folder spam.",true);
   }catch(e){show("Link reset belum berhasil dikirim. Coba lagi beberapa saat.");}
   finally{submitEl.disabled=false;submitEl.textContent="Kirim Link Reset"}
   return;
 }

 const pw=passwordEl.value,n=nameEl.value.trim();
 if(pw.length<6||(reg&&!n)){show("Lengkapi data. Password minimal 6 karakter.");return}
 submitEl.disabled=true;submitEl.textContent="Memproses...";
 try{
   const performanceLogin=!reg&&rawUpper===PERFORMANCE_ID;
   const em=performanceLogin?PERFORMANCE_EMAIL:raw.toLowerCase();
   const body=reg?{email:em,password:pw,data:{full_name:n,referral_code:ref||null}}:{email:em,password:pw};
   const r=await req(reg?"/auth/v1/signup":"/auth/v1/token?grant_type=password",body);
   const t=await r.text();if(!r.ok)throw Error(t);const d=JSON.parse(t);

   if(d.access_token){
     if(performanceLogin){
       sessionStorage.setItem("sg_admin_token",d.access_token);
       sessionStorage.setItem("sg_admin_email",PERFORMANCE_EMAIL);
       location.replace("admin.html");
       return;
     }
     localStorage.setItem("sg_user_token",d.access_token);localStorage.setItem("sg_user_email",em);
     localStorage.setItem("sg_user_name",reg?n:(d.user?.user_metadata?.full_name||em.split("@")[0]));
     localStorage.setItem("sg_user_id",d.user?.id||"");
     const metaRef=(d.user?.user_metadata?.referral_code||ref||"").trim().toUpperCase();if(metaRef)localStorage.setItem("sg_ref_code",metaRef);
     await attachAffiliate(em,d.user?.id||"",d.access_token,metaRef);
     try{await req("/rest/v1/rpc/sg_affiliate_sync_self",{p_email:em},d.access_token)}catch(_){}
     location.replace("shop.html");
   }else show("Akun dibuat. Jika verifikasi email aktif, buka email verifikasi lalu masuk.");
 }catch(e){show(reg?"Pendaftaran belum berhasil. Email mungkin sudah terdaftar.":"Email/ID atau password salah.")}
 finally{submitEl.disabled=false;submitEl.textContent=reg?"Buat Akun":"Masuk"}
};
passwordEl.onkeydown=e=>{if(e.key==="Enter"&&!forgot)submitEl.click()};
</script></body></html>
