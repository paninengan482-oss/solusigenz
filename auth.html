<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akun — Solusi Genz</title><link rel="stylesheet" href="revamp.css"></head><body><main class="auth-wrap"><section class="card auth-card"><a href="index.html"><img class="auth-logo" src="solusi-genz-v2.svg" alt="Solusi Genz"></a><span class="badge">AKUN PELANGGAN</span><h1 id="title">Selamat datang kembali.</h1><p class="muted" id="subtitle">Masuk untuk membuka dashboard pelanggan.</p><div id="nameField" class="field" style="display:none"><label>Nama lengkap</label><input id="name"></div><div class="field" style="margin-top:14px"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password"></div><button id="submit" class="btn btn-primary" style="width:100%;margin-top:18px">Masuk</button><div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="muted" id="switch">Belum punya akun? <a href="auth.html?mode=register"><b>Daftar gratis</b></a></p></section></main><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id),titleEl=$("title"),subtitleEl=$("subtitle"),nameFieldEl=$("nameField"),nameEl=$("name"),emailEl=$("email"),passwordEl=$("password"),submitEl=$("submit"),msgEl=$("msg"),switchEl=$("switch");const q=new URLSearchParams(location.search),reg=q.get("mode")==="register",urlRef=(q.get("ref")||"").trim().toUpperCase(),savedRef=(localStorage.getItem("sg_ref_code")||"").trim().toUpperCase(),ref=urlRef||savedRef;if(ref)localStorage.setItem("sg_ref_code",ref);if(reg){titleEl.textContent="Buat akun Solusi Genz.";subtitleEl.textContent=ref?"Daftar melalui link referral.":"Daftar sekali, lalu akses katalog produk dan pesanan.";nameFieldEl.style.display="flex";submitEl.textContent="Buat Akun";switchEl.innerHTML='Sudah punya akun? <a href="auth.html'+(ref?'?ref='+encodeURIComponent(ref):'')+'"><b>Masuk</b></a>'}async function req(path,body,token=""){const headers={"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY};if(token)headers.Authorization="Bearer "+token;return fetch(window.SG_SUPABASE_URL+path,{method:"POST",headers,body:JSON.stringify(body)})}function show(s){msgEl.textContent=s;msgEl.style.display="block"}async function attachReferral(em,userId,token,code=""){const effective=(code||ref||"").trim().toUpperCase();if(!effective||!token)return false;try{const r=await req("/rest/v1/rpc/sg_affiliate_attach_referral",{p_buyer_email:em,p_buyer_user_id:userId||null,p_referral_code:effective},token);if(r.ok){localStorage.setItem("sg_ref_attached",effective);localStorage.setItem("sg_ref_code",effective);return true}}catch(_){ }return false}submitEl.onclick=async()=>{const em=emailEl.value.trim(),pw=passwordEl.value,n=nameEl.value.trim();if(!em||pw.length<6||(reg&&!n)){show("Lengkapi data. Password minimal 6 karakter.");return}submitEl.disabled=true;submitEl.textContent="Memproses...";try{const body=reg?{email:em,password:pw,data:{full_name:n,referral_code:ref||null}}:{email:em,password:pw};const r=await req(reg?"/auth/v1/signup":"/auth/v1/token?grant_type=password",body);const t=await r.text();if(!r.ok)throw Error(t);const d=JSON.parse(t);if(d.access_token){localStorage.setItem("sg_user_token",d.access_token);localStorage.setItem("sg_user_email",em);localStorage.setItem("sg_user_name",reg?n:(d.user?.user_metadata?.full_name||em.split("@")[0]));localStorage.setItem("sg_user_id",d.user?.id||"");const metaRef=(d.user?.user_metadata?.referral_code||ref||"").trim().toUpperCase();if(metaRef)localStorage.setItem("sg_ref_code",metaRef);await attachReferral(em,d.user?.id||"",d.access_token,metaRef);try{await req("/rest/v1/rpc/sg_affiliate_sync_self",{p_email:em},d.access_token)}catch(_){ }location.replace("shop.html")}else show("Akun dibuat. Silakan masuk dengan email dan password yang kamu daftarkan.")}catch(e){show(reg?"Pendaftaran belum berhasil. Email mungkin sudah terdaftar.":"Email atau password salah.")}finally{submitEl.disabled=false;submitEl.textContent=reg?"Buat Akun":"Masuk"}};
</script></body></html>
