<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil — Solusi Genz</title><link rel="stylesheet" href="revamp.css"></head><body><script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script><main class="auth-wrap"><section class="card auth-card"><a href="shop.html"><img class="auth-logo" src="assets/solusi-genz-logo.jpg"></a><h1>Profil Pelanggan</h1><div class="field"><label>Nama</label><input id="pname"></div><div class="field" style="margin-top:12px"><label>Email</label><input id="pemail" disabled></div><div class="field" style="margin-top:12px"><label>WhatsApp</label><input id="pwa"></div><button id="save" class="btn btn-primary" style="width:100%;margin-top:18px">Simpan Profil</button><p id="msg" class="muted"></p></section></main><script>pname.value=localStorage.getItem("sg_user_name")||"";pemail.value=localStorage.getItem("sg_user_email")||"";pwa.value=localStorage.getItem("sg_user_wa")||"";save.onclick=()=>{localStorage.setItem("sg_user_name",pname.value.trim()||"Genz");localStorage.setItem("sg_user_wa",pwa.value.trim());msg.textContent="Profil berhasil disimpan."}</script></body></html>
