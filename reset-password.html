<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>Reset Password — Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="solusi-genz-theme.css"></head><body>
<main class="auth-wrap"><section class="card auth-card"><a href="index.html"><img class="auth-logo" src="solusi-genz-v2.svg" alt="Solusi Genz"></a><span class="badge">RESET PASSWORD</span><h1>Buat password baru.</h1><p class="muted">Gunakan minimal 6 karakter.</p><div class="field"><label>Password baru</label><input id="pw1" type="password"></div><div class="field" style="margin-top:12px"><label>Ulangi password</label><input id="pw2" type="password"></div><button id="save" class="btn btn-primary" style="width:100%;margin-top:18px">Simpan Password Baru</button><div id="msg" class="notice" style="display:none;margin-top:14px"></div></section></main>
<script src="supabase-config.js"></script><script>
const h=new URLSearchParams(location.hash.replace(/^#/,"")),token=h.get("access_token")||"",type=h.get("type")||"";
function show(s,ok=false){msg.textContent=s;msg.style.display="block";msg.className=ok?"notice ok":"notice"}
if(!token||type!=="recovery")show("Link reset tidak valid atau sudah kedaluwarsa. Minta link baru dari halaman login.");
save.onclick=async()=>{if(!token)return;const a=pw1.value,b=pw2.value;if(a.length<6){show("Password minimal 6 karakter.");return}if(a!==b){show("Password tidak sama.");return}save.disabled=true;try{const r=await fetch(window.SG_SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({password:a})});if(!r.ok)throw Error(await r.text());show("Password berhasil diubah. Mengarahkan ke halaman login...",true);setTimeout(()=>location.replace("auth.html"),1200)}catch(e){show("Password belum berhasil diubah. Minta link reset baru.")}finally{save.disabled=false}};
</script></body></html>
