<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="v17-core.css"></head><body>
<main class="auth-wrap"><section class="card auth-card"><a href="index.html"><img class="auth-logo" src="solusi-genz-v2.svg"></a><span class="badge">RESET PASSWORD</span><h1>Buat password baru.</h1><p class="muted">Gunakan minimal 6 karakter.</p>
<div class="field"><label>Password baru</label><input id="pw1" type="password"></div><div class="field" style="margin-top:14px"><label>Ulangi password baru</label><input id="pw2" type="password"></div>
<button id="saveBtn" class="btn btn-primary" style="width:100%;margin-top:18px">Simpan Password Baru</button><div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="muted"><a href="auth.html"><b>Kembali ke halaman Masuk</b></a></p></section></main>
<script src="supabase-config.js"></script><script>
(()=>{
const hash=new URLSearchParams(location.hash.replace(/^#/,"")),query=new URLSearchParams(location.search);
const token=hash.get("access_token")||query.get("access_token")||"",msg=document.getElementById("msg"),btn=document.getElementById("saveBtn");
function show(s,ok=false){msg.textContent=s;msg.style.display="block";msg.style.borderColor=ok?"#86efac":""}
if(!token){show("Link reset tidak valid atau kedaluwarsa. Kirim ulang reset dari halaman Masuk.");btn.disabled=true}
btn.onclick=async()=>{
 const a=document.getElementById("pw1").value,b=document.getElementById("pw2").value;
 if(a.length<6){show("Password minimal 6 karakter.");return}if(a!==b){show("Kedua password harus sama.");return}
 btn.disabled=true;btn.textContent="Menyimpan...";
 try{
  const r=await fetch(window.SG_SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({password:a})});
  if(!r.ok)throw new Error(await r.text());
  ["sg_admin_token","sg_admin_refresh","sg_admin_email"].forEach(k=>sessionStorage.removeItem(k));
  ["sg_user_token","sg_user_refresh"].forEach(k=>localStorage.removeItem(k));
  show("Password berhasil diubah. Silakan masuk kembali.",true);setTimeout(()=>location.replace("auth.html"),1000);
 }catch(e){show("Password belum berhasil diubah. Gunakan link reset terbaru.");btn.disabled=false;btn.textContent="Simpan Password Baru"}
};
})();
</script></body></html>
