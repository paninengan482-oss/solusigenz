<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Solusi Genz</title><link rel="stylesheet" href="revamp.css"></head><body><main class="auth-wrap"><section class="card auth-card"><a href="index.html"><img class="auth-logo" src="solusi-genz-v2.svg" alt="Solusi Genz"></a><span class="badge">RESET PASSWORD</span><h1>Buat password baru.</h1><p class="muted">Password baru berlaku untuk akun pelanggan maupun Admin.</p><div class="field"><label>Password baru</label><input id="pw1" type="password" autocomplete="new-password"></div><div class="field" style="margin-top:14px"><label>Ulangi password baru</label><input id="pw2" type="password" autocomplete="new-password"></div><button id="saveBtn" class="btn btn-primary" style="width:100%;margin-top:18px">Simpan Password Baru</button><div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="muted"><a href="auth.html"><b>Kembali ke halaman Masuk</b></a></p></section></main><script src="supabase-config.js"></script><script>
const hash=new URLSearchParams(location.hash.replace(/^#/,""));const query=new URLSearchParams(location.search);const token=hash.get("access_token")||query.get("access_token")||"";const type=hash.get("type")||query.get("type")||"";
// Recovery links can arrive at the site root first; index/auth forwards the complete query/hash here.const msg=document.getElementById("msg"),btn=document.getElementById("saveBtn");function show(s){msg.textContent=s;msg.style.display="block"}
if(!token){show("Link reset belum membawa sesi pemulihan atau sudah kedaluwarsa. Kembali ke halaman Masuk lalu kirim ulang Reset Password.");btn.disabled=true}
btn.onclick=async()=>{const a=document.getElementById("pw1").value,b=document.getElementById("pw2").value;if(a.length<6){show("Password minimal 6 karakter.");return}if(a!==b){show("Ulangi password harus sama.");return}btn.disabled=true;btn.textContent="Menyimpan...";try{const r=await fetch(window.SG_SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({password:a})});if(!r.ok)throw Error(await r.text());show("Password berhasil diubah. Silakan masuk menggunakan password baru.");setTimeout(()=>location.replace("auth.html"),1600)}catch(e){show("Password belum berhasil diubah. Link mungkin sudah kedaluwarsa; kirim ulang Reset Password dari halaman Masuk.");btn.disabled=false;btn.textContent="Simpan Password Baru"}};
</script></body></html>
