<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto Produk — Admin Solusi Genz</title><link rel="stylesheet" href="revamp.css"><link rel="stylesheet" href="v17-core.css"></head><body>
<script>if(!sessionStorage.getItem("sg_admin_token"))location.replace("auth.html")</script>
<div class="app-shell"><aside class="sidebar"><a href="admin.html"><img class="sg-logo" src="solusi-genz-v2.svg"></a><nav class="side-nav"><a href="admin.html">Dashboard Admin</a><a class="active" href="product-media.html">Foto Produk</a></nav></aside><main class="main"><header class="topbar"><div><h1>Foto Produk</h1><p>Ganti foto katalog kapan saja tanpa mengubah sistem checkout.</p></div><a class="btn btn-ghost" href="admin.html">Kembali ke Admin</a></header><section class="card panel"><h3>Kelola Media Katalog</h3><p class="muted">Pilih foto dari perangkat. Gambar dikompres otomatis dan disimpan bersama data produk yang sudah ada.</p><div id="mediaGrid" class="media-admin-grid"><div class="muted">Memuat produk...</div></div><div id="msg" class="notice" style="display:none;margin-top:16px"></div></section></main></div>
<script src="supabase-config.js"></script><script src="sg-core.js"></script><script>
(()=>{
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let products=[];
function parseDesc(raw){const s=String(raw||"");const m=s.match(/\[\[SGIMG:([\s\S]*?)\]\]/);return{image:m?m[1]:"",text:s.replace(/\[\[SGIMG:[\s\S]*?\]\]\s*/,"").trim()}}
function packDesc(image,text){return (image?`[[SGIMG:${image}]]\n`:"")+String(text||"").trim()}
function compress(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=900,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const ctx=c.getContext("2d");ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.72))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
async function rpc(n,b={}){return SGCore.rpc(n,b,sessionStorage.getItem("sg_admin_token")||"","admin")}
function render(){mediaGrid.innerHTML=products.map(p=>{const d=parseDesc(p.description);return `<article class="media-card"><div class="media-preview">${d.image?`<img src="${esc(d.image)}" alt="${esc(p.name)}">`:`<span>Belum ada foto</span>`}</div><h3>${esc(p.name)}</h3><p>${esc(p.duration||"")}</p><input class="media-input" data-id="${p.id}" type="file" accept="image/*" style="display:none"><div class="toolbar"><button class="btn btn-primary choose" data-id="${p.id}" type="button">Pilih Foto</button>${d.image?`<button class="btn btn-ghost remove" data-id="${p.id}" type="button">Hapus Foto</button>`:""}</div></article>`}).join("")||'<div class="muted">Belum ada produk.</div>';document.querySelectorAll(".choose").forEach(b=>b.onclick=()=>document.querySelector(`.media-input[data-id="${b.dataset.id}"]`).click());document.querySelectorAll(".media-input").forEach(i=>i.onchange=()=>saveImage(i.dataset.id,i.files?.[0]));document.querySelectorAll(".remove").forEach(b=>b.onclick=()=>saveImage(b.dataset.id,null))}
async function saveImage(id,file){const p=products.find(x=>String(x.id)===String(id));if(!p)return;msg.style.display="block";msg.textContent=file?"Mengompres dan menyimpan foto...":"Menghapus foto...";try{const d=parseDesc(p.description),image=file?await compress(file):"";await rpc("sg_admin_catalog_save",{p_id:p.id,p_name:p.name,p_category:p.category||"",p_duration:p.duration||"",p_description:packDesc(image,d.text),p_price:Number(p.price||0),p_commission_amount:Number(p.commission_amount||0),p_active:!!p.active,p_sort_order:Number(p.sort_order||100)});msg.innerHTML='<span class="money-green">Foto produk berhasil diperbarui.</span>';await load()}catch(e){console.error(e);msg.textContent="Foto belum berhasil disimpan."}}
async function load(){try{products=await rpc("sg_admin_catalog_list")||[];render()}catch(e){console.error(e);mediaGrid.innerHTML='<div class="notice">Produk belum dapat dimuat.</div>'}}load();
})();
</script></body></html>
