<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Solusi Genz</title><link rel="stylesheet" href="revamp.css"></head><body><script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script><main class="auth-wrap"><section class="card auth-card"><a href="shop.html"><img class="auth-logo" src="solusi-genz-v2.svg"></a><span class="badge">CHECKOUT</span><h1 id="pname">Produk Digital</h1><p class="muted">Setelah pesanan dibuat, transfer sesuai instruksi lalu upload bukti pembayaran. Pembayaran tetap diverifikasi Admin.</p><div class="field"><label>Total</label><input id="pprice" disabled></div><div class="field" style="margin-top:12px"><label>Nama lengkap</label><input id="name"></div><div class="field" style="margin-top:12px"><label>WhatsApp</label><input id="wa"></div><div class="field" style="margin-top:12px"><label>Email akun</label><input id="email" type="email" disabled></div><div class="field" style="margin-top:12px"><label>Metode pembayaran</label><select id="method"><option value="Transfer Bank Mandiri">Transfer Bank Mandiri</option></select></div><button id="orderBtn" class="btn btn-primary" style="width:100%;margin-top:18px">Buat Pesanan</button><div id="msg" class="notice" style="margin-top:14px">Belum ada pembayaran yang dianggap sah sebelum diverifikasi Admin.</div></section></main><script src="supabase-config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),product=q.get("product")||"Produk Digital",price=Number(q.get("price")||0),token=localStorage.getItem("sg_user_token")||"",uid=localStorage.getItem("sg_user_id")||"",buyerEmail=(localStorage.getItem("sg_user_email")||"").trim().toLowerCase();pname.textContent=product;pprice.value="Rp "+price.toLocaleString("id-ID");name.value=localStorage.getItem("sg_user_name")||"";email.value=buyerEmail;wa.value=localStorage.getItem("sg_user_wa")||"";function inv(){const a=new Uint8Array(6);crypto.getRandomValues(a);return"SGZ-"+Array.from(a,b=>b.toString(16).padStart(2,"0")).join("").toUpperCase()}async function rpc(n,b){const r=await fetch(window.SG_SUPABASE_URL+"/rest/v1/rpc/"+n,{method:"POST",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}async function attachRef(){let ref=(localStorage.getItem("sg_ref_code")||"").trim().toUpperCase();if(!ref)return;try{await rpc("sg_affiliate_attach_referral",{p_buyer_email:buyerEmail,p_buyer_user_id:uid||null,p_referral_code:ref})}catch(_){}}orderBtn.onclick=async()=>{if(!name.value.trim()||!wa.value.trim()||!buyerEmail){msg.textContent="Lengkapi nama dan WhatsApp.";return}orderBtn.disabled=true;msg.textContent="Membuat pesanan...";try{await attachRef();localStorage.setItem("sg_user_wa",wa.value.trim());const invoice=inv();await rpc("sg_create_order",{p_invoice:invoice,p_product_name:product,p_price:price,p_customer_name:name.value.trim(),p_whatsapp:wa.value.trim(),p_email:buyerEmail,p_payment_method:method.value});location.replace("status.html?id="+encodeURIComponent(invoice)+"&new=1")}catch(e){console.error(e);msg.textContent="Pesanan belum berhasil dibuat. Pastikan database V15 sudah aktif.";orderBtn.disabled=false}}})();
</script></body></html>
