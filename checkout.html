<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c">
<title>Checkout — Solusi Genz</title>
<link rel="stylesheet" href="revamp.css">
<link rel="stylesheet" href="solusi-genz-theme.css">
</head>
<body>
<script>
if(!localStorage.getItem("sg_user_token")) location.replace("auth.html");
</script>

<main class="auth-wrap">
<section class="card auth-card">
<a href="shop.html"><img class="auth-logo" src="solusi-genz-v2.svg"></a>
<span class="badge">CHECKOUT</span>
<h1 id="pname">Produk Digital</h1>
<p class="muted">Lengkapi data pesanan. Setelah dibuat, pesanan langsung muncul di Pesanan Saya.</p>

<div class="field"><label>Total</label><input id="pprice" disabled></div>
<div class="field" style="margin-top:12px"><label>Nama lengkap</label><input id="name" autocomplete="name"></div>
<div class="field" style="margin-top:12px"><label>WhatsApp</label><input id="wa" inputmode="tel" autocomplete="tel"></div>
<div class="field" style="margin-top:12px"><label>Email akun</label><input id="email" type="email" readonly></div>
<div class="field" style="margin-top:12px"><label>Metode pembayaran</label>
<select id="method"><option value="Transfer Bank Mandiri">Transfer Bank Mandiri</option></select>
</div>

<button id="orderBtn" class="btn btn-primary" style="width:100%;margin-top:18px" type="button">Buat Pesanan</button>
<div id="msg" class="notice" style="margin-top:14px">Pesanan akan dicatat ke database.</div>
</section>
</main>

<script src="supabase-config.js"></script>
<script>
(()=>{
 const $=id=>document.getElementById(id);
 const pnameEl=$("pname"),ppriceEl=$("pprice"),nameEl=$("name"),waEl=$("wa"),
       emailEl=$("email"),methodEl=$("method"),orderBtnEl=$("orderBtn"),msgEl=$("msg");
 const q=new URLSearchParams(location.search);
 const product=(q.get("product")||"Produk Digital").trim();
 const price=Number(q.get("price")||0);
 const token=localStorage.getItem("sg_user_token")||"";
 const buyerEmail=(localStorage.getItem("sg_user_email")||"").trim().toLowerCase();
 const uid=localStorage.getItem("sg_user_id")||"";

 pnameEl.textContent=product;
 ppriceEl.value="Rp "+Number(price||0).toLocaleString("id-ID");
 nameEl.value=localStorage.getItem("sg_user_name")||"";
 emailEl.value=buyerEmail;

 function inv(){
   const a=new Uint8Array(6);
   crypto.getRandomValues(a);
   return "SGZ-"+Array.from(a,b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
 }

 async function rpc(name,body={}){
   const r=await fetch(window.SG_SUPABASE_URL+"/rest/v1/rpc/"+name,{
     method:"POST",
     headers:{
       "Content-Type":"application/json",
       "apikey":window.SG_SUPABASE_KEY,
       "Authorization":"Bearer "+token
     },
     body:JSON.stringify(body),
     cache:"no-store"
   });
   const text=await r.text();
   if(!r.ok) throw new Error(text||("RPC "+name+" gagal"));
   try{return text?JSON.parse(text):null}catch(_){return text}
 }

 orderBtnEl.onclick=async()=>{
   const name=nameEl.value.trim();
   const wa=waEl.value.trim();

   if(!token){
     location.replace("auth.html");
     return;
   }
   if(!buyerEmail){
     msgEl.textContent="Email akun tidak terbaca. Silakan keluar lalu login kembali.";
     return;
   }
   if(!name||!wa){
     msgEl.textContent="Lengkapi nama dan WhatsApp.";
     return;
   }
   if(!Number.isFinite(price)||price<=0){
     msgEl.textContent="Harga produk tidak valid. Kembali ke toko lalu pilih produk lagi.";
     return;
   }

   const invoice=inv();
   orderBtnEl.disabled=true;
   orderBtnEl.textContent="Membuat Pesanan...";
   msgEl.textContent="Menyimpan pesanan...";

   try{
     await rpc("sg_create_order_v6",{
       p_invoice:invoice,
       p_product_name:product,
       p_price:Math.round(price),
       p_customer_name:name,
       p_whatsapp:wa,
       p_payment_method:methodEl.value
     });

     localStorage.setItem("sg_user_name",name);

     // Affiliate tidak boleh menggagalkan transaksi utama.
     try{await rpc("sg_affiliate_sync_self_v6",{})}catch(_){}

     msgEl.innerHTML="<b>Pesanan berhasil dibuat.</b> Membuka Pesanan Saya...";
     setTimeout(()=>location.replace("status.html"),350);
   }catch(err){
     console.error("ORDER ERROR:",err);
     msgEl.innerHTML="<b>Pesanan gagal dibuat.</b> "+(
       String(err.message||"").includes("duplicate") ?
       "Silakan tekan Buat Pesanan sekali lagi." :
       "Silakan refresh halaman lalu coba lagi."
     );
     orderBtnEl.disabled=false;
     orderBtnEl.textContent="Buat Pesanan";
   }
 };
})();
</script>
</body>
</html>
