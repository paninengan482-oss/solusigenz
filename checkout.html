<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Solusi Genz</title><link rel="stylesheet" href="launch.css"></head><body><script>if(!localStorage.getItem('sg_user_token'))location.replace('auth.html')</script><main class="auth-page"><section class="card auth-card"><a class="auth-logo" href="shop.html"><span class="sg-dot">SG</span><b>Kembali ke Dashboard</b></a><span class="kicker">CHECKOUT</span><h1 id="pname">Produk Digital</h1><p class="muted">Periksa detail paket sebelum membuat pesanan. Setelah pesanan dibuat, transfer sesuai instruksi lalu unggah bukti pembayaran.</p><div class="notice"><b>Total Pembayaran</b><div id="pprice" style="font-size:26px;font-weight:800;margin-top:5px"></div></div><div class="field" style="margin-top:14px"><label>Nama lengkap</label><input id="name"></div><div class="field" style="margin-top:12px"><label>WhatsApp</label><input id="wa" inputmode="tel"></div><div class="field" style="margin-top:12px"><label>Email</label><input id="email" type="email" disabled></div><div class="field" style="margin-top:12px"><label>Metode pembayaran</label><select id="method"><option>Transfer Bank Mandiri</option></select></div><button id="orderBtn" class="btn btn-primary" style="width:100%;margin-top:18px">Buat Pesanan</button><div id="msg" class="notice" style="display:none;margin-top:12px"></div></section></main><script src="supabase-config.js"></script><script>
const q=new URLSearchParams(location.search),product=q.get('product')||'Produk Digital',price=Number(q.get('price')||0),token=localStorage.getItem('sg_user_token'),uid=localStorage.getItem('sg_user_id')||'';pname.textContent=product;pprice.textContent='Rp '+price.toLocaleString('id-ID');name.value=localStorage.getItem('sg_user_name')||'';email.value=localStorage.getItem('sg_user_email')||'';function inv(){const a=new Uint8Array(6);crypto.getRandomValues(a);return'SGZ-'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('').toUpperCase()}orderBtn.onclick=async()=>{if(!name.value.trim()||!wa.value.trim())return alert('Lengkapi nama dan WhatsApp.');orderBtn.disabled=true;msg.style.display='block';msg.textContent='Menyimpan pesanan...';const invoice=inv();try{const ref=(localStorage.getItem('sg_ref_code')||'').trim().toUpperCase();if(ref)try{await fetch(SG_SUPABASE_URL+'/rest/v1/rpc/sg_affiliate_attach_referral',{method:'POST',headers:{'Content-Type':'application/json','apikey':SG_SUPABASE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({p_buyer_email:email.value,p_buyer_user_id:uid||null,p_referral_code:ref})})}catch(_){}const r=await fetch(SG_SUPABASE_URL+'/rest/v1/rpc/sg_create_order',{method:'POST',headers:{'Content-Type':'application/json','apikey':SG_SUPABASE_KEY,'Authorization':'Bearer '+SG_SUPABASE_KEY},body:JSON.stringify({p_invoice:invoice,p_product_name:product,p_price:price,p_customer_name:name.value.trim(),p_whatsapp:wa.value.trim(),p_email:email.value,p_payment_method:method.value})});if(!r.ok)throw Error(await r.text());location.replace('status.html?id='+encodeURIComponent(invoice)+'&new=1')}catch(e){msg.textContent='Pesanan belum berhasil dibuat. Coba lagi.';orderBtn.disabled=false}};
</script></body></html>
