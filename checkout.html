<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Solusi Genz</title><link rel="stylesheet" href="styles.css"></head><body><script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script>
<nav class="nav"><div class="container navin"><a class="brand" href="index.html"><div class="logo">S</div><div>SOLUSI GENZ</div></a><a class="btn btn-ghost" href="index.html">← Kembali</a></div></nav>
<div class="container form-wrap"><div class="card form-card"><div class="badge" style="margin-bottom:12px">V5 • TRANSFER MANDIRI</div><h1>Checkout</h1><p style="color:var(--muted)">Isi data berikut. Setelah pesanan dibuat, instruksi transfer Mandiri akan langsung tampil.</p>
<div class="summary"><div class="row"><span>Produk</span><b id="pname">Produk Digital</b></div><div class="row" style="margin-top:8px"><span>Total</span><b id="pprice">Rp 0</b></div></div>
<div class="field"><label>Nama lengkap</label><input id="name" autocomplete="name" placeholder="Nama kamu"></div>
<div class="field"><label>WhatsApp</label><input id="wa" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx"></div>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="nama@email.com"></div>
<div class="field"><label>Metode pembayaran</label><select id="method"><option value="Transfer Bank Mandiri">Transfer Bank Mandiri</option></select></div>
<button id="orderBtn" class="btn btn-primary" style="width:100%" type="button">Buat Pesanan</button>
<div id="msg" class="note" style="margin-top:16px">Pesanan akan dicatat ke database dan kamu akan menerima nomor invoice.</div></div></div>
<script src="supabase-config.js"></script>
<script>
(function(){
 const q=new URLSearchParams(location.search);
 const product=q.get('product')||'Produk Digital';
 const price=Number(q.get('price')||0);
 const $=id=>document.getElementById(id);
 $('pname').textContent=product;
 $('pprice').textContent='Rp '+price.toLocaleString('id-ID'); $('name').value=localStorage.getItem('sg_user_name')||''; $('email').value=localStorage.getItem('sg_user_email')||'';
 function makeInvoice(){ const a=new Uint8Array(6); crypto.getRandomValues(a); return 'SGZ-'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('').toUpperCase(); }
 function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}
 function validWa(v){return /^[0-9+\-\s]{8,20}$/.test(v)}
 async function makeOrder(){
   const n=$('name').value.trim(), w=$('wa').value.trim(), e=$('email').value.trim(), m=$('method').value;
   const btn=$('orderBtn'), msg=$('msg');
   if(!n){alert('Isi nama lengkap dulu.');return}
   if(!validWa(w)){alert('Nomor WhatsApp belum valid. Contoh: 081234567890');return}
   if(!validEmail(e)){alert('Alamat email belum valid.');return}
   const invoice=makeInvoice(); btn.disabled=true; btn.textContent='Membuat pesanan...'; msg.textContent='Menghubungkan ke database...';
   try{
     const res=await fetch(window.SG_SUPABASE_URL+'/rest/v1/rpc/sg_create_order',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SG_SUPABASE_KEY,'Authorization':'Bearer '+window.SG_SUPABASE_KEY},body:JSON.stringify({p_invoice:invoice,p_product_name:product,p_price:price,p_customer_name:n,p_whatsapp:w,p_email:e,p_payment_method:m})});
     const txt=await res.text(); if(!res.ok) throw new Error(txt||('HTTP '+res.status));
     location.replace('status.html?id='+encodeURIComponent(invoice)+'&new=1');
   }catch(err){console.error('SG_ORDER_ERROR',err);msg.innerHTML='<b>Pesanan belum berhasil disimpan.</b><br>Coba sekali lagi.';btn.disabled=false;btn.textContent='Coba Lagi';}
 }
 $('orderBtn').addEventListener('click',makeOrder);
})();
</script></body></html>
