<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Solusi Genz</title><link rel="stylesheet" href="revamp.css"></head><body><script>if(!localStorage.getItem("sg_user_token"))location.replace("auth.html")</script><main class="auth-wrap"><section class="card auth-card"><a href="shop.html"><img class="auth-logo" src="assets/solusi-genz-logo.jpg"></a><span class="badge">CHECKOUT</span><h1 id="pname">Produk Digital</h1><p class="muted">Lengkapi data pesanan. Dana pembayaran tetap masuk melalui metode pembayaran/bank yang tersedia; website hanya mencatat transaksi.</p><div class="field"><label>Total</label><input id="pprice" disabled></div><div class="field" style="margin-top:12px"><label>Nama lengkap</label><input id="name"></div><div class="field" style="margin-top:12px"><label>WhatsApp</label><input id="wa"></div><div class="field" style="margin-top:12px"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:12px"><label>Metode pembayaran</label><select id="method"><option value="Transfer Bank Mandiri">Transfer Bank Mandiri</option></select></div><button id="orderBtn" class="btn btn-primary" style="width:100%;margin-top:18px">Buat Pesanan</button><div id="msg" class="notice" style="margin-top:14px">Pesanan akan dicatat ke database.</div></section></main><script src="supabase-config.js"></script><script>
(()=>{const $=id=>document.getElementById(id);
const pnameEl=$("pname"),ppriceEl=$("pprice"),nameEl=$("name"),waEl=$("wa"),emailEl=$("email"),methodEl=$("method"),orderBtnEl=$("orderBtn"),msgEl=$("msg");
const q=new URLSearchParams(location.search),product=q.get("product")||"Produk Digital",price=Number(q.get("price")||0),token=localStorage.getItem("sg_user_token")||"",uid=localStorage.getItem("sg_user_id")||"";
pnameEl.textContent=product;
ppriceEl.value="Rp "+price.toLocaleString("id-ID");
nameEl.value=localStorage.getItem("sg_user_name")||"";
emailEl.value=localStorage.getItem("sg_user_email")||"";
function inv(){const a=new Uint8Array(6);crypto.getRandomValues(a);return"SGZ-"+Array.from(a,b=>b.toString(16).padStart(2,"0")).join("").toUpperCase()}
orderBtnEl.onclick=async()=>{
  if(!nameEl.value.trim()||!waEl.value.trim()||!emailEl.value.trim()){alert("Lengkapi data.");return}
  const invoice=inv();
  orderBtnEl.disabled=true;
  msgEl.textContent="Menghubungkan ke database...";
  try{
    let body={p_invoice:invoice,p_product_name:product,p_price:price,p_customer_name:nameEl.value.trim(),p_whatsapp:waEl.value.trim(),p_email:emailEl.value.trim(),p_payment_method:methodEl.value};
    const r=await fetch(window.SG_SUPABASE_URL+"/rest/v1/rpc/sg_create_order",{method:"POST",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+window.SG_SUPABASE_KEY},body:JSON.stringify(body)});
    if(!r.ok)throw Error(await r.text());
    try{
      await fetch(window.SG_SUPABASE_URL+"/rest/v1/rpc/sg_affiliate_attach_order",{method:"POST",headers:{"Content-Type":"application/json","apikey":window.SG_SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({p_invoice:invoice,p_buyer_user_id:uid||null,p_buyer_email:emailEl.value.trim()})})
    }catch(_){}
    location.replace("status.html?id="+encodeURIComponent(invoice)+"&new=1")
  }catch(e){
    console.error(e);
    msgEl.textContent="Pesanan belum berhasil disimpan. Coba lagi.";
    orderBtnEl.disabled=false
  }
};
})();
</script></body></html>
